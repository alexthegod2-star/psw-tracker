# Installs the tracker on the server whenever main changes (after a pull request is merged).
# Needs repo secrets DEPLOY_HOST, DEPLOY_KNOWN_HOSTS, DEPLOY_KEY from  sudo bash psw-tracker/deploy/setup-deploy.sh
name: Deploy to server
on:
  push:
    branches: [main]
    paths: ["psw-tracker/**"]
  workflow_dispatch:
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the page
        run: python3 psw-tracker/make_index.py
      - name: Send to server and install
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SIMPLETEXTING_API_KEY: ${{ secrets.SIMPLETEXTING_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DOCUSIGN_INTEGRATION_KEY: ${{ secrets.DOCUSIGN_INTEGRATION_KEY }}
          DOCUSIGN_USER_ID: ${{ secrets.DOCUSIGN_USER_ID }}
          DOCUSIGN_PRIVATE_KEY: ${{ secrets.DOCUSIGN_PRIVATE_KEY }}
        run: |
          # optional repo secret ANTHROPIC_API_KEY: sent along with the update; install.sh puts it in the server's .env (never in the repo)
          if [ -n "$ANTHROPIC_API_KEY" ]; then (umask 077; printf '%s' "$ANTHROPIC_API_KEY" > psw-tracker/.claude-key); fi
          # optional repo secret RESEND_API_KEY (email sending): same route, as .resend-key
          if [ -n "$RESEND_API_KEY" ]; then (umask 077; printf '%s' "$RESEND_API_KEY" > psw-tracker/.resend-key); fi
          # optional repo secret SIMPLETEXTING_API_KEY (texting): same route, as .text-key
          if [ -n "$SIMPLETEXTING_API_KEY" ]; then (umask 077; printf '%s' "$SIMPLETEXTING_API_KEY" > psw-tracker/.text-key); fi
          # optional repo secret TELEGRAM_BOT_TOKEN (sign-in codes by Telegram): same route, as .tg-key
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then (umask 077; printf '%s' "$TELEGRAM_BOT_TOKEN" > psw-tracker/.tg-key); fi
          # optional repo secrets DOCUSIGN_INTEGRATION_KEY, DOCUSIGN_USER_ID, DOCUSIGN_PRIVATE_KEY (Send for signature): same route, as .ds-id and .ds-key
          if [ -n "$DOCUSIGN_INTEGRATION_KEY" ] && [ -n "$DOCUSIGN_USER_ID" ]; then (umask 077; printf '%s\n%s\n' "$DOCUSIGN_INTEGRATION_KEY" "$DOCUSIGN_USER_ID" > psw-tracker/.ds-id); fi
          if [ -n "$DOCUSIGN_PRIVATE_KEY" ]; then (umask 077; printf '%s' "$DOCUSIGN_PRIVATE_KEY" > psw-tracker/.ds-key); fi
          install -m 700 -d ~/.ssh
          [ -n "$DEPLOY_HOST" ] || { echo "::error::Secret DEPLOY_HOST is missing or empty"; exit 1; }
          [ -n "$DEPLOY_KNOWN_HOSTS" ] || { echo "::error::Secret DEPLOY_KNOWN_HOSTS is missing or empty"; exit 1; }
          [ -n "$DEPLOY_KEY" ] || { echo "::error::Secret DEPLOY_KEY is missing or empty"; exit 1; }
          # Copying from a Windows terminal can add carriage returns, trailing spaces or join the key into one line.
          python3 - <<'PY'
          import os, re
          k = os.environ["DEPLOY_KEY"].replace("\r", "")
          m = re.search(r"-----BEGIN ([A-Z ]+)-----(.*?)-----END \1-----", k, re.S)
          if not m:
              print("::error::DEPLOY_KEY has no BEGIN/END lines; copy every line from -----BEGIN to -----END")
              raise SystemExit(1)
          body = re.sub(r"\s+", "", m.group(2))
          lines = [body[i:i + 70] for i in range(0, len(body), 70)]
          open(os.path.expanduser("~/.ssh/deploy_key"), "w").write(
              f"-----BEGIN {m.group(1)}-----\n" + "\n".join(lines) + f"\n-----END {m.group(1)}-----\n")
          kh = " ".join(os.environ["DEPLOY_KNOWN_HOSTS"].replace("\r", "").split())
          open(os.path.expanduser("~/.ssh/known_hosts"), "w").write(kh + "\n")
          PY
          chmod 600 ~/.ssh/deploy_key
          HOST="$(echo "$DEPLOY_HOST" | tr -d '[:space:]')"
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null 2>&1 || { echo "::error::DEPLOY_KEY is not a valid private key; run setup-deploy.sh again and recopy it"; exit 1; }
          ssh-keygen -F "$HOST" >/dev/null || { echo "::error::DEPLOY_KNOWN_HOSTS does not start with the DEPLOY_HOST address ($HOST)"; exit 1; }
          set +e
          tar czf - --exclude='__pycache__' psw-tracker | ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20 deploy@"$HOST" > deploy.log 2> ssh.err
          rc=$?
          set -e
          cat deploy.log
          if ! grep -q '== App is running' deploy.log; then
            echo "::error::Install did not finish (ssh exit $rc): $(tail -c 600 ssh.err | tr '\n' ' ') $(tail -c 600 deploy.log | tr '\n' ' ')"
            exit 1
          fi
          echo "::notice::Installed on the server. $(grep 'Backed up to' deploy.log || true)"
