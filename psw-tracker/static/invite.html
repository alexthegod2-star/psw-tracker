<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PSW Tracker sign up</title>
<style>
  :root{--bg:#e3eefb;--panel:#fff;--ink:#16263a;--muted:#5b6b80;--line:#c5d3e4;--accent:#1f5fa8}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
  form{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:28px 24px;width:100%;max-width:340px;display:grid;gap:14px;box-shadow:0 6px 24px rgba(20,50,90,.08)}
  .top{display:flex;align-items:center;gap:10px}
  .top img{height:40px}
  h1{font-size:18px;margin:0}
  label{display:grid;gap:5px;font-size:13px;color:var(--muted)}
  input{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:7px;color:var(--ink)}
  input:focus{outline:2px solid var(--accent);outline-offset:-1px}
  button{font:inherit;font-weight:600;padding:10px;border:0;border-radius:7px;background:var(--accent);color:#fff;cursor:pointer}
  .hint{color:var(--muted);font-size:13px;margin:0}
  .bad{color:#b42318;font-size:13px;margin:0}
</style>
</head>
<body>
<form method="post" action="/invite">
  <div class="top"><img src="/psw-logo.png" alt="" onerror="this.remove()"><h1>Welcome to the PSW Tracker</h1></div>
  <p class="hint" id="who">Choose a password to finish setting up your login.</p>
  <p class="bad" id="bad" hidden>The passwords didn't match or were shorter than 8 characters.</p>
  <input type="hidden" name="t" id="t">
  <label>Username<input id="user" readonly></label>
  <label>New password<input name="password" type="password" minlength="8" autocomplete="new-password" required autofocus></label>
  <label>Same password again<input name="password2" type="password" minlength="8" autocomplete="new-password" required></label>
  <button type="submit">Create my login</button>
</form>
<script>
const t=new URLSearchParams(location.search).get('t')||'';document.getElementById('t').value=t;
if(/[?&]bad=1/.test(location.search))document.getElementById('bad').hidden=false;
fetch('/api/auth/invite?t='+encodeURIComponent(t)).then(r=>r.ok?r.json():null).then(i=>{if(!i)return;
  document.getElementById('user').value=i.username;
  document.getElementById('who').textContent='Hi '+i.name.split(' ')[0]+', choose a password to finish setting up your login. You\'ll sign in with this username.'});
</script>
</body>
</html>
