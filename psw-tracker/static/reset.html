<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PSW Tracker reset password</title>
<style>
  :root{--bg:#e3eefb;--panel:#fff;--ink:#16263a;--muted:#5b6b80;--line:#c5d3e4;--accent:#1f5fa8}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
  form{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:28px 24px;width:100%;max-width:340px;display:grid;gap:14px;box-shadow:0 6px 24px rgba(20,50,90,.08)}
  .top{display:flex;align-items:center;gap:10px}
  .top img{height:40px}
  h1{font-size:18px;margin:0}
  label{display:grid;gap:5px;font-size:13px;color:var(--muted)}
  input{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:7px;color:var(--ink)}
  input:focus{outline:2px solid var(--accent);outline-offset:-1px}
  button{font:inherit;font-weight:600;padding:10px;border:0;border-radius:7px;background:var(--accent);color:#fff;cursor:pointer}
  .bad{color:#b42318;font-size:13px;margin:0}.ok{color:#18794e;font-size:13px;margin:0}
  .fp{color:var(--accent);font-size:13px;justify-self:center}
</style>
</head>
<body>
<form method="post" action="/reset">
  <div class="top"><img src="/psw-logo.png" alt="" onerror="this.remove()"><h1>Reset your password</h1></div>
  <p class="ok" id="sent" hidden>If that matches a login with an email address, we sent a reset link to it. It works for 60 minutes. Check your spam folder if you don’t see it.</p>
  <p class="bad" id="expired" hidden>That reset link expired or was already used. Ask for a new one.</p>
  <label>Username or email<input name="who" autocomplete="username" autocapitalize="none" required autofocus></label>
  <button type="submit">Email me a reset link</button>
  <a class="fp" href="/login">Back to sign in</a>
</form>
<script>for(const k of ['sent','expired'])if(new RegExp('[?&]'+k+'=').test(location.search))document.getElementById(k).hidden=false</script>
</body>
</html>
