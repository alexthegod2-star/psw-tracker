<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PSW Tracker new password</title>
<style>
  :root{--bg:#e3eefb;--panel:#fff;--ink:#16263a;--muted:#5b6b80;--line:#c5d3e4;--accent:#1f5fa8}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
  form{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:28px 24px;width:100%;max-width:340px;display:grid;gap:14px;box-shadow:0 6px 24px rgba(20,50,90,.08)}
  .top{display:flex;align-items:center;gap:10px}
  .top img{height:40px}
  h1{font-size:18px;margin:0}
  label{display:grid;gap:5px;font-size:13px;color:var(--muted)}
  input{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:7px;color:var(--ink)}
  input:focus{outline:2px solid var(--accent);outline-offset:-1px}
  button{font:inherit;font-weight:600;padding:10px;border:0;border-radius:7px;background:var(--accent);color:#fff;cursor:pointer}
  .bad{color:#b42318;font-size:13px;margin:0}.ok{color:#18794e;font-size:13px;margin:0}
  .fp{color:var(--accent);font-size:13px;justify-self:center}
</style>
</head>
<body>
<form method="post" action="/reset/new">
  <div class="top"><img src="/psw-logo.png" alt="" onerror="this.remove()"><h1>Pick a new password</h1></div>
  <p class="bad" id="bad" hidden>The passwords need to match and be at least 8 characters.</p>
  <input type="hidden" name="t" id="t">
  <label>New password<input name="password" type="password" autocomplete="new-password" minlength="8" required autofocus></label>
  <label>Type it again<input name="password2" type="password" autocomplete="new-password" minlength="8" required></label>
  <button type="submit">Save new password</button>
</form>
<script>const q=new URLSearchParams(location.search);document.getElementById('t').value=q.get('t')||'';if(q.get('bad'))document.getElementById('bad').hidden=false</script>
</body>
</html>
